name: Deploy main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy on main server
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Deployer sur le serveur de test
        uses: appleboy/ssh-action@v1.2.5

        env:
          API_URL: ${{ secrets.MAIN_API_URL }}
          PUBLIC_API_URL: ${{ secrets.MAIN_PUBLIC_API_URL }}
          PUBLIC_SITE_URL: ${{ secrets.MAIN_PUBLIC_SITE_URL }}
          SITE_ENV: ${{ secrets.MAIN_SITE_ENV }}
          CRYPT_KEY: ${{ secrets.MAIN_CRYPTO_KEY }}
          PM2_APP_NAME: ${{ secrets.MAIN_PM2_APP_NAME }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: API_URL,PUBLIC_API_URL,PUBLIC_SITE_URL,SITE_ENV,CRYPT_KEY,PM2_APP_NAME
          script: |
            set -e
            mkdir -p /var/www/${{ secrets.SERVER_USER }}/${{ secrets.DOMAIN }}/
            cd /var/www/${{ secrets.SERVER_USER }}/${{ secrets.DOMAIN }}/
            git checkout main
            git pull --ff-only origin main

            echo "[4/11] Mise a jour de la configuration de test"

            dotenv_quote() {
            php -r '
            echo json_encode(
              $argv[1],
              JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE
            );
            ' "$1"
            }


            NUXT_PLATFORM_API_BASE_VALUE="$(dotenv_quote "$API_URL")"
            NUXT_PUBLIC_PLATFORM_API_BASE_VALUE="$(dotenv_quote "$PUBLIC_API_URL")"
            NUXT_SITE_URL_VALUE="$(dotenv_quote "$PUBLIC_SITE_URL")"
            NUXT_SITE_ENV_VALUE="$(dotenv_quote "$SITE_ENV")"
            NUXT_CRYPTO_SECRET_KEY_VALUE="$(dotenv_quote "$CRYPT_KEY")"



            cat > .env.production <<EOF
            # Configuration de l'application
            NUXT_PLATFORM_API_BASE=${NUXT_PLATFORM_API_BASE_VALUE}
            NUXT_PUBLIC_PLATFORM_API_BASE=${NUXT_PUBLIC_PLATFORM_API_BASE_VALUE}
            NUXT_SITE_URL=${NUXT_SITE_URL_VALUE}
            NUXT_SITE_ENV=${NUXT_SITE_ENV_VALUE}

            # Configuration de la clé secrète pour le chiffrement
            NUXT_CRYPTO_SECRET_KEY=${NUXT_CRYPTO_SECRET_KEY_VALUE}
            EOF


            chmod 600 .env.production

            npm ci
            npm run build -- --dotenv .env.production
            pm2 reload ecosystem.config.cjs --update-env
            pm2 save

