name: Deploy test

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy on test server
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.2.0

        env:
          API_URL: ${{ secrets.API_URL }}
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          CRYPT_KEY: ${{ secrets.CRYPTO_KEY }}
          STRIPE_MODE: ${{ secrets.STRIPE_MODE }}
          SUCCESS_URL: ${{ secrets.SUCCESS_URL }}
          CANCEL_URL: ${{ secrets.CANCEL_URL }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            mkdir -p /var/www/${{ secrets.USERNAME }}/test.${{ secrets.DOMAIN }}/
            cd /var/www/${{ secrets.USERNAME }}/test.${{ secrets.DOMAIN }}/
            git checkout develop
            git pull --ff-only origin develop

            echo "[4/11] Mise a jour de la configuration de test"

            dotenv_quote() {
            php -r '
            echo json_encode(
              $argv[1],
              JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE
            );
            ' "$1"
            }

            NUXT_PLATFORM_API_BASE_VALUE=https://api.demo.bellagp.com
            NUXT_PUBLIC_PLATFORM_API_BASE_VALUE=https://api.demo.bellagp.com
            NUXT_PUBLIC_SITE_URL_VALUE=https://demo.bellagp.com
            NUXT_CRYPTO_SECRET_KEY_VALUE=demo_crypto_secret_key_replace_me
            NUXT_STRIPE_MODE_VALUE=test
            NUXT_STRIPE_SUCCESS_URL_VALUE=https://demo.bellagp.com/confirm
            NUXT_STRIPE_CANCEL_URL_VALUE=https://demo.bellagp.com/expedition


            cat > .env.local <<EOF
            # Configuration de l'application
            NUXT_PLATFORM_API_BASE=${NUXT_PLATFORM_API_BASE_VALUE}
            NUXT_PUBLIC_PLATFORM_API_BASE=${NUXT_PUBLIC_PLATFORM_API_BASE_VALUE}
            NUXT_PUBLIC_SITE_URL=${NUXT_PUBLIC_SITE_URL_VALUE}

            # Configuration de la clé secrète pour le chiffrement
            NUXT_CRYPTO_SECRET_KEY=${NUXT_CRYPTO_SECRET_KEY_VALUE}
            
            # Configuration Stripe
            NUXT_STRIPE_MODE=${NUXT_STRIPE_MODE_VALUE}
            NUXT_STRIPE_SUCCESS_URL=${NUXT_STRIPE_SUCCESS_URL_VALUE}
            NUXT_STRIPE_CANCEL_URL=${NUXT_STRIPE_CANCEL_URL_VALUE}
            EOF

            chmod 600 .env.local

            npm ci
            npm run build
            pm2 restart NODE_ENV=production node .output/server/index.mjs
